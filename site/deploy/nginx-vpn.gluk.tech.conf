# GlukVPN — публичный сайт vpn.gluk.tech (статика, канал beta 0.3.0)
#
# Сайт не содержит серверного кода: ни PHP, ни Node, ни Python.
# API живёт на отдельном домене (api.gluk.tech / beta-api.gluk.tech),
# проксировать его через этот сервер не нужно.
#
# Установка:
#   rsync -a --delete site/ /var/www/vpn.gluk.tech/
#   cp site/deploy/nginx-vpn.gluk.tech.conf /etc/nginx/sites-available/vpn.gluk.tech
#   ln -s /etc/nginx/sites-available/vpn.gluk.tech /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name vpn.gluk.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vpn.gluk.tech;

    ssl_certificate     /etc/letsencrypt/live/vpn.gluk.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.gluk.tech/privkey.pem;

    root /var/www/vpn.gluk.tech;
    index index.html;
    charset utf-8;

    # Маршруты сайта — обычные папки с index.html:
    # /features/ /mobile/ /pricing/ /download/ /support/ /login/ /privacy/ /terms/
    # /app/ и /account/ зарезервированы под будущий веб-кабинет.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Статика кешируется долго, HTML — нет
    location ~* \.(css|js|woff2|woff|png|jpg|svg|ico|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    access_log /var/log/nginx/vpn.gluk.tech.access.log;
    error_log  /var/log/nginx/vpn.gluk.tech.error.log;
}
