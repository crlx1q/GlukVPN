name: build-apk

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Control API base URL compiled into the APK"
        required: false
        default: "https://api.gluk.tech"
      publish_release:
        description: "Publish to GitHub Releases"
        type: boolean
        required: false
        default: false
  push:
    branches: [main, master, beta, desktop/beta]
    paths:
      - "flutter-client/lib/**"
      - "flutter-client/test/**"
      - "flutter-client/pubspec.yaml"
      - "flutter-client/android_overrides/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: flutter-client

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ github.ref == 'refs/heads/beta' && 'https://beta-api.gluk.tech' || (github.event.inputs.api_base_url || 'https://api.gluk.tech') }}
      ALLOW_BETA_CHANNEL: ${{ github.ref == 'refs/heads/beta' && 'true' || 'false' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          java -version

      - name: Generate android/ scaffold
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --org tech.gluk --project-name glukvpn /tmp/scaffold
            cp -R /tmp/scaffold/android ./android
          fi

      - name: Apply our Android overrides
        run: |
          set -euo pipefail
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -R android_overrides/res/* android/app/src/main/res/
          cat android_overrides/namespace_patch.gradle >> android/build.gradle
          rm -f android/app/src/debug/AndroidManifest.xml
          rm -f android/app/src/profile/AndroidManifest.xml
          echo "--- permissions compiled into the app ---"
          grep -E "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: |
          set -euo pipefail
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=ALLOW_BETA_CHANNEL="$ALLOW_BETA_CHANNEL"

      - name: Sign with the release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using $BUILD_TOOLS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            build/app/outputs/flutter-apk/app-release.apk /tmp/glukvpn-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out glukvpn-release.apk \
            /tmp/glukvpn-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs glukvpn-release.apk
          rm -f /tmp/release.jks /tmp/glukvpn-aligned.apk

      - name: Keep the Flutter-signed APK (no keystore configured)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk glukvpn-release.apk
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, APK signed with Flutter debug key."

      - name: APK fingerprint
        run: |
          set -euo pipefail
          ls -lh glukvpn-release.apk
          sha256sum glukvpn-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: glukvpn-apk
          path: flutter-client/glukvpn-release.apk
          if-no-files-found: error

      - name: Parse Version
        id: version
        run: |
          VERSION=$(grep '^version:' flutter-client/pubspec.yaml | sed 's/version: //')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/beta" ]; then
            echo "CHANNEL=beta" >> $GITHUB_ENV
          else
            echo "CHANNEL=stable" >> $GITHUB_ENV
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.APP_VERSION }}-build${{ github.run_number }}
          name: GlukVPN Android v${{ env.APP_VERSION }} - Build ${{ github.run_number }}
          prerelease: true
          files: flutter-client/glukvpn-release.apk
          body: |
            GlukVPN Android Client - v${{ env.APP_VERSION }} (${{ env.CHANNEL }})

            * API base URL: `${{ env.API_BASE_URL }}`
            * Commit: ${{ github.sha }}
            * Signed with a release keystore: `${{ env.HAS_KEYSTORE }}`

          overwrite_files: true
