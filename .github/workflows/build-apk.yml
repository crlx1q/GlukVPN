name: build-apk

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Control API base URL compiled into the APK"
        required: false
        default: "https://api.gluk.tech"
      publish_release:
        description: "Publish to GitHub Releases"
        type: boolean
        required: false
        default: false
  push:
    branches: [main, master, beta, desktop/beta]
    paths:
      - "flutter-client/lib/**"
      - "flutter-client/test/**"
      - "flutter-client/pubspec.yaml"
      - "flutter-client/android_overrides/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: flutter-client

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ github.ref == 'refs/heads/beta' && 'https://beta-api.gluk.tech' || (github.event.inputs.api_base_url || 'https://api.gluk.tech') }}
      ALLOW_BETA_CHANNEL: ${{ github.ref == 'refs/heads/beta' && 'true' || 'false' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          java -version

      - name: Generate android/ scaffold
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --org tech.gluk --project-name glukvpn /tmp/scaffold
            cp -R /tmp/scaffold/android ./android
          fi

      - name: Apply our Android overrides
        run: |
          set -euo pipefail
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -R android_overrides/res/* android/app/src/main/res/
          # Our Kotlin layer: MainActivity (which replaces the scaffold's own),
          # the foreground service that draws the ongoing notification with the
          # Disconnect button, its broadcast receiver and the Dart bridge.
          # The destination is read back from where `flutter create` put
          # MainActivity.kt, so changing --org can never silently skip it.
          MAIN_ACTIVITY="$(find android/app/src/main/kotlin -name MainActivity.kt -print -quit)"
          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::could not find the generated MainActivity.kt to override."
            exit 1
          fi
          KOTLIN_DIR="$(dirname "$MAIN_ACTIVITY")"
          cp android_overrides/kotlin/*.kt "$KOTLIN_DIR"/
          echo "--- Kotlin sources in $KOTLIN_DIR ---"
          ls -1 "$KOTLIN_DIR"
          cat android_overrides/namespace_patch.gradle >> android/build.gradle
          # Persistent release signing. Reads android/key.properties (written by
          # the step below from the repository secrets) or the ANDROID_* env
          # variables, and falls back to the debug key when neither is complete.
          cat android_overrides/signing_config.gradle >> android/app/build.gradle
          rm -f android/app/src/debug/AndroidManifest.xml
          rm -f android/app/src/profile/AndroidManifest.xml
          echo "--- permissions compiled into the app ---"
          grep -E "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        run: flutter pub get

      - name: Patch wireguard_flutter permission handling
        run: |
          set -euo pipefail
          python3 -c '
          import glob, os

          pattern = os.path.expanduser("~/.pub-cache/hosted/pub.dev/wireguard_flutter-*/android/src/main/kotlin/billion/group/wireguard_flutter/WireguardFlutterPlugin.kt")
          files = glob.glob(pattern)
          if not files:
              print("No wireguard_flutter found in pub cache to patch")
          for f in files:
              with open(f, "r") as fp:
                  content = fp.read()
              target1 = "this.activity = activityPluginBinding.activity as FlutterActivity"
              replace1 = "this.activity = activityPluginBinding.activity as FlutterActivity\n        activityPluginBinding.addActivityResultListener(this)"
              if target1 in content and "addActivityResultListener" not in content:
                  content = content.replace(target1, replace1)

              target2 = "checkPermission()\n                    throw Exception(\"Permissions are not given\")"
              replace2 = "checkPermission()\n                    if (!havePermission) {\n                        throw Exception(\"Permissions are not given\")\n                    }"
              if target2 in content:
                  content = content.replace(target2, replace2)

              with open(f, "w") as fp:
                  fp.write(content)
              print(f"Successfully patched {f}")
          '

      - name: Analyze
        run: flutter analyze || true

      - name: Unit tests
        run: flutter test

      - name: Decode the release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Gradle signs the APK while it is being built now, so the keystore
          # has to be on disk before `flutter build apk` runs - not after it,
          # the way the old apksigner step repacked an already debug-signed
          # artefact.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/glukvpn-release.jks
          if [ ! -s android/glukvpn-release.jks ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore file."
            exit 1
          fi
          # This is the file signing_config.gradle reads. It is written here
          # rather than committed, and deleted again after the build.
          {
            echo "storeFile=glukvpn-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
          cp android/glukvpn-release.jks android/app/glukvpn-release.jks
          cp android/key.properties android/app/key.properties
          chmod 600 android/key.properties android/glukvpn-release.jks android/app/key.properties android/app/glukvpn-release.jks
          echo "Keystore staged for Gradle: $(wc -c < android/glukvpn-release.jks) bytes"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: glukvpn-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # ROUND 12: every published client points at PROD, whatever branch it
          # was built from. Shipping a beta-wired APK is what produced "I cannot
          # sign in on my phone": beta is a separate deployment with a separate
          # database, the account simply is not there, and the switch that would
          # have moved the app back was hidden from non-admins in round 11.
          case "$API_BASE_URL" in
            *beta-api*) API_BASE_URL="https://api.gluk.tech" ;;
          esac
          # Beta must still be compiled in, or the in-app switch cannot exist
          # even for an administrator - which is why the PC and the phone show
          # no channel control at all on this branch. The job-level
          # ALLOW_BETA_CHANNEL is superseded by this line.
          #
          # The version code has to grow on every build. Android compares it
          # before anything else: an equal code makes the install a silent
          # no-op, a lower one is refused outright. The run number is monotonic.
          flutter build apk --release \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ALLOW_BETA_CHANNEL=true

      - name: Verify the release signature
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          # Gradle has already signed and zipaligned this APK with the
          # persistent keystore, so there is nothing left to re-sign. What is
          # worth doing is checking *which* certificate ended up on it: the
          # previous flow signed the artefact a second time, which worked but
          # hid a missing keystore until an install failed on a real phone.
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "Using $BUILD_TOOLS"
          cp build/app/outputs/flutter-apk/app-release.apk glukvpn-release.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs glukvpn-release.apk
          # A debug certificate here means the keystore never reached Gradle.
          # Publishing that APK would ship another build nobody can upgrade to.
          if "$BUILD_TOOLS/apksigner" verify --print-certs glukvpn-release.apk \
            | grep -qi "CN=Android Debug"; then
            echo "::error::The release APK carries a debug certificate - the keystore was not used."
            exit 1
          fi

      - name: Remove the keystore from the workspace
        if: always()
        run: rm -f android/key.properties android/glukvpn-release.jks android/app/key.properties android/app/glukvpn-release.jks

      - name: Debug-key build (no keystore configured)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          set -euo pipefail
          # This is the whole "app not installed" bug, and it is a signing
          # problem, not an Android quirk. With no keystore, `flutter build apk
          # --release` falls back to the debug key - and the debug key is
          # generated per machine, so a fresh CI runner invents a new one on
          # every run. Android refuses to replace an installed app with a build
          # signed by a different key, so each release could only be installed
          # by deleting the previous one and losing its data.
          #
          # The artefact is named so it cannot be handed to a user by accident,
          # and the release publish step below is skipped entirely.
          cp build/app/outputs/flutter-apk/app-release.apk \
            glukvpn-DEBUGKEY-do-not-distribute.apk
          cp build/app/outputs/flutter-apk/app-release.apk \
            glukvpn-release.apk
          echo "::warning::No ANDROID_KEYSTORE_BASE64 secret. This APK is signed with a throwaway debug key."

      - name: APK fingerprint
        run: |
          set -euo pipefail
          ls -lh glukvpn-*.apk
          sha256sum glukvpn-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: glukvpn-apk
          # Matches both the signed build and the debug-key one, so a run that
          # is missing its secrets still uploads something inspectable.
          path: flutter-client/glukvpn-*.apk
          if-no-files-found: error

      - name: Parse Version
        id: version
        run: |
          # Every run step already starts in flutter-client (defaults.run), so
          # the old flutter-client/pubspec.yaml path matched nothing and the tag
          # came out as "android-v-build<n>".
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          if [ "${{ github.ref }}" = "refs/heads/beta" ]; then
            echo "CHANNEL=beta" >> $GITHUB_ENV
          else
            echo "CHANNEL=stable" >> $GITHUB_ENV
          fi

      - name: Publish release
        # Never publish an APK that cannot upgrade the one already installed.
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.APP_VERSION }}-build${{ github.run_number }}
          name: GlukVPN Android v${{ env.APP_VERSION }} - Build ${{ github.run_number }}
          prerelease: true
          files: flutter-client/glukvpn-release.apk
          body: |
            GlukVPN Android Client - v${{ env.APP_VERSION }} (${{ env.CHANNEL }})

            * API base URL: `${{ env.API_BASE_URL }}`
            * Commit: ${{ github.sha }}
            * Signed with a release keystore: `${{ env.HAS_KEYSTORE }}`

          overwrite_files: true
