name: Build Desktop Client

on:
  push:
    branches:
      - desktop/beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'

      - name: Configure Flutter for Windows Desktop
        run: flutter config --enable-windows-desktop
        shell: pwsh

      - name: Install Dependencies
        run: |
          choco install innosetup 7zip -y
          Invoke-WebRequest -Uri "https://github.com/ip7z/7zip/releases/download/26.02/7z2602-extra.7z" -OutFile 7z-extra.7z
          & "C:\Program Files\7-Zip\7z.exe" x 7z-extra.7z -o"C:\Program Files\7-Zip" -y
        shell: pwsh

      # Both DLLs, not just one. The tunnel service loads wireguard.dll
      # (WireGuardNT) *and* tunnel.dll (WireGuard's embeddable tunnel service);
      # tunnel.dll was never downloaded, so every build reported
      # driver_unavailable and could not connect. A missing file fails the job.
      - name: Download WireGuard dependencies
        run: |
          $vendor = 'native\glukvpn-tunnel-service\vendor\amd64'
          New-Item -ItemType Directory -Force -Path $vendor | Out-Null

          Invoke-WebRequest -Uri https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip -OutFile wg-nt.zip -UseBasicParsing
          Expand-Archive -Path wg-nt.zip -DestinationPath wg-nt -Force
          Copy-Item wg-nt\wireguard-nt\bin\amd64\wireguard.dll $vendor -Force

          $index = 'https://download.wireguard.com/windows-client/'
          $version = '0.5.3'
          try {
            $listing = (Invoke-WebRequest -Uri $index -UseBasicParsing).Content
            $newest = [regex]::Matches($listing, 'embeddable-dll-service-amd64-([0-9.]+)\.zip') |
              ForEach-Object { $_.Groups[1].Value } |
              Sort-Object { [version]$_ } |
              Select-Object -Last 1
            if ($newest) { $version = $newest }
          } catch {
            Write-Host "Could not list $index, using $version"
          }

          Invoke-WebRequest -Uri ($index + 'embeddable-dll-service-amd64-' + $version + '.zip') -OutFile wg-svc.zip -UseBasicParsing
          Expand-Archive -Path wg-svc.zip -DestinationPath wg-svc -Force
          $tunnel = Get-ChildItem -Path wg-svc -Filter tunnel.dll -Recurse | Select-Object -First 1
          if (-not $tunnel) { throw 'tunnel.dll not found in the embeddable service archive' }
          Copy-Item $tunnel.FullName $vendor -Force

          foreach ($dll in @('tunnel.dll', 'wireguard.dll')) {
            if (-not (Test-Path (Join-Path $vendor $dll))) { throw "$dll is missing from $vendor" }
          }
          Get-ChildItem $vendor | Format-Table Name, Length
        shell: pwsh

      - name: Generate Flutter Windows scaffolding
        run: flutter create . --platforms windows --project-name glukvpn
        working-directory: flutter-client
        shell: pwsh

      - name: Generate Icons
        run: |
          pwsh -ExecutionPolicy Bypass -File desktop\packaging\make-icons.ps1
          Copy-Item flutter-client\assets\app.ico flutter-client\windows\runner\resources\app_icon.ico -Force
        shell: pwsh

      - name: Build Desktop App
        run: pwsh -ExecutionPolicy Bypass -File desktop\packaging\build-all.ps1 -Channel prod -Installer
        shell: pwsh
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlukVPN-Windows-Setup
          path: dist/*.exe

      - name: Publish Windows Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v1.0.0-build${{ github.run_number }}
          name: GlukVPN Windows v1.0.0 - Build ${{ github.run_number }}
          prerelease: true
          files: dist/GlukVPN-Setup-*.exe
          body: |
            GlukVPN Windows Desktop Client - v1.0.0
            
            * Installer: `GlukVPN-Setup-1.0.0.exe`
            * Commit: ${{ github.sha }}
            * Channel: Production
