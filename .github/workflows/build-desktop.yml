name: Build Desktop Client

on:
  push:
    branches:
      - desktop/beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'

      - name: Configure Flutter for Windows Desktop
        run: flutter config --enable-windows-desktop
        shell: pwsh

      - name: Install Dependencies
        run: |
          choco install innosetup 7zip -y
          Invoke-WebRequest -Uri "https://github.com/ip7z/7zip/releases/download/26.02/7z2602-extra.7z" -OutFile 7z-extra.7z
          & "C:\Program Files\7-Zip\7z.exe" x 7z-extra.7z -o"C:\Program Files\7-Zip" -y
        shell: pwsh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.22'

      # ROUND 7 - userspace WireGuard. Two artefacts: wintun.dll (the
      # WHQL-signed adapter) and glukvpn-wg.exe (our wireguard-go data plane).
      # tunnel.dll is gone - it launches the WireGuardNT kernel driver, which
      # Core Isolation refuses, and that is why the tunnel died after 1s.
      - name: Build the tunnel data plane
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $vendor = 'native\glukvpn-tunnel-service\vendor\amd64'
          New-Item -ItemType Directory -Force -Path $vendor | Out-Null

          # 1. wintun.dll: mandatory, straight from the official WHQL build.
          if (-not (Test-Path (Join-Path $vendor 'wintun.dll'))) {
            Invoke-WebRequest -Uri https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip -UseBasicParsing
            Expand-Archive -Path wintun.zip -DestinationPath wintun -Force
            Copy-Item wintun\wintun\bin\amd64\wintun.dll $vendor -Force
          }

          # 2. glukvpn-wg.exe: a plain `go build` with cgo off, so the runner
          #    needs no mingw/gcc toolchain.
          $dest = Join-Path (Resolve-Path $vendor) 'glukvpn-wg.exe'
          Push-Location native\glukvpn-tunnel-service\go\glukvpn-wg
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go mod tidy
          if ($LASTEXITCODE -ne 0) { throw 'go mod tidy failed for the tunnel data plane' }
          go build -ldflags="-w -s" -trimpath -o $dest .
          if ($LASTEXITCODE -ne 0) { throw 'go build failed for the tunnel data plane' }
          Pop-Location

          # 3. sing-box.exe - the DPI-resistant data plane (round 24).
          #    Official release binary, taken unmodified. It creates the
          #    Wintun adapter itself and installs routes through auto_route,
          #    so none of the hand-written Windows plumbing is on the path.
          #    It loads the same wintun.dll fetched above.
          $singbox = Join-Path $vendor 'sing-box.exe'
          if (-not (Test-Path $singbox)) {
            $zipUrl = ''
            try {
              $headers = @{}
              if ($env:GITHUB_TOKEN) { $headers['Authorization'] = "Bearer $env:GITHUB_TOKEN" }
              $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/SagerNet/sing-box/releases/latest' -Headers $headers -UseBasicParsing
              $asset = $release.assets | Where-Object { $_.name -like 'sing-box-*-windows-amd64.zip' } | Select-Object -First 1
              if ($asset) { $zipUrl = $asset.browser_download_url }
            } catch {
              Write-Warning "Could not fetch latest release metadata from GitHub API: $_"
            }
            if (-not $zipUrl) {
              $zipUrl = 'https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-windows-amd64.zip'
            }
            Write-Host "Downloading sing-box from $zipUrl"
            Invoke-WebRequest -Uri $zipUrl -OutFile singbox.zip -UseBasicParsing
            Expand-Archive -Path singbox.zip -DestinationPath singbox -Force
            $found = Get-ChildItem -Path singbox -Filter 'sing-box.exe' -Recurse | Select-Object -First 1
            if (-not $found) { throw 'sing-box.exe was not found inside the release archive.' }
            Copy-Item $found.FullName $singbox -Force
            Write-Host "vendored sing-box successfully"
          }

          foreach ($artifact in @('glukvpn-wg.exe', 'wintun.dll', 'sing-box.exe')) {
            if (-not (Test-Path (Join-Path $vendor $artifact))) { throw "$artifact is missing from $vendor" }
          }
          Get-ChildItem $vendor | Format-Table Name, Length
        shell: pwsh

      - name: Generate Flutter Windows scaffolding
        run: flutter create . --platforms windows --project-name glukvpn
        working-directory: flutter-client
        shell: pwsh

      # ROUND 17: the empty white window on a second launch.
      #
      # The Win32 runner creates and shows its window before Dart main() runs,
      # so the guard in lib/desktop/services/single_instance.dart can never
      # prevent it - the second copy painted a blank window and only then said
      # it was already running. The guard has to live in the runner, and
      # flutter create regenerates windows/, so our runner is vendored and
      # copied over the scaffold here, exactly like android_overrides.
      - name: Apply our Windows runner overrides
        run: Copy-Item -Path windows_overrides\* -Destination windows -Recurse -Force
        working-directory: flutter-client
        shell: pwsh

      - name: Generate Icons
        run: |
          pwsh -ExecutionPolicy Bypass -File desktop\packaging\make-icons.ps1
          Copy-Item flutter-client\assets\app.ico flutter-client\windows\runner\resources\app_icon.ico -Force
        shell: pwsh

      - name: Build Desktop App
        run: pwsh -ExecutionPolicy Bypass -File desktop\packaging\build-all.ps1 -Channel prod -Installer
        shell: pwsh
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlukVPN-Windows-Setup
          path: dist/*.exe

      - name: Publish Windows Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v1.3.0-build${{ github.run_number }}
          name: GlukVPN Windows v1.3.0 - Build ${{ github.run_number }}
          prerelease: true
          files: dist/GlukVPN-Setup-*.exe
          body: |
            GlukVPN Windows Desktop Client - v1.3.0
            
            * Installer: `GlukVPN-Setup-1.3.0.exe`
            * Commit: ${{ github.sha }}
            * Channel: Production
