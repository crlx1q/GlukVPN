name: Build Desktop Client

on:
  push:
    branches:
      - desktop/beta
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.x'

      - name: Configure Flutter for Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: choco install innosetup -y

      - name: Download WireGuard dependencies
        run: |
          # 1. wireguard-nt
          Invoke-WebRequest -Uri https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip -OutFile wg-nt.zip
          Expand-Archive -Path wg-nt.zip -DestinationPath wg-nt
          New-Item -ItemType Directory -Force -Path native\glukvpn-tunnel-service\vendor\amd64 | Out-Null
          Copy-Item wg-nt\wireguard-nt\bin\amd64\wireguard.dll native\glukvpn-tunnel-service\vendor\amd64\
          
          # 2. wireguard-windows MSI
          Invoke-WebRequest -Uri https://download.wireguard.com/windows-client/wireguard-amd64-1.1.msi -OutFile wg.msi
          
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/a "$PWD\wg.msi" /qb TARGETDIR="$PWD\wg-extracted"" -Wait -NoNewWindow
          
          $tunnelDll = Get-ChildItem -Path wg-extracted -Recurse -Filter tunnel.dll | Select-Object -First 1
          if ($tunnelDll) {
              Copy-Item $tunnelDll.FullName native\glukvpn-tunnel-service\vendor\amd64\
          } else {
              Write-Error "tunnel.dll not found in MSI"
          }

      - name: Generate Icons
        run: powershell -ExecutionPolicy Bypass -File desktop\packaging\make-icons.ps1

      - name: Build Desktop App
        run: powershell -ExecutionPolicy Bypass -File desktop\packaging\build-all.ps1 -Channel prod -Installer
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlukVPN-Windows-Setup
          path: dist\*.exe
