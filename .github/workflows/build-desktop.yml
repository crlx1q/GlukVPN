name: Build Desktop Client

on:
  push:
    branches:
      - desktop/beta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'

      - name: Configure Flutter for Windows Desktop
        run: flutter config --enable-windows-desktop
        shell: pwsh

      - name: Install Dependencies
        run: |
          choco install innosetup 7zip -y
          Invoke-WebRequest -Uri "https://github.com/ip7z/7zip/releases/download/26.02/7z2602-extra.7z" -OutFile 7z-extra.7z
          & "C:\Program Files\7-Zip\7z.exe" x 7z-extra.7z -o"C:\Program Files\7-Zip" -y
        shell: pwsh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.22'

      # ROUND 6 - Wintun. Both DLLs: wintun.dll (WHQL-signed driver) and
      # tunnel.dll (WireGuard's embeddable service, Wintun backend).
      - name: Download and build tunnel dependencies
        run: |
          $vendor = 'native\glukvpn-tunnel-service\vendor\amd64'
          New-Item -ItemType Directory -Force -Path $vendor | Out-Null

          # 1. tunnel.dll from an official release zip. Its Wintun backend is
          #    what makes the tunnel come up on WDAC / Memory-integrity
          #    machines, where WireGuardNT is refused with ERROR_ACCESS_DENIED.
          $paired = $false
          foreach ($ver in @('0.5.3', '0.5.2', '0.4.9')) {
            try {
              Invoke-WebRequest -Uri "https://download.wireguard.com/windows-client/embeddable-dll-service-amd64-$ver.zip" -OutFile embed.zip -UseBasicParsing
              Expand-Archive -Path embed.zip -DestinationPath embed -Force
              foreach ($dll in @('tunnel.dll', 'wintun.dll')) {
                $f = Get-ChildItem -Path embed -Filter $dll -Recurse | Select-Object -First 1
                if ($f) { Copy-Item $f.FullName $vendor -Force }
              }
              if (Test-Path (Join-Path $vendor 'tunnel.dll')) { $paired = $true; Write-Host "matched DLL pair from release $ver"; break }
            } catch { Write-Host "embeddable-dll-service $ver unavailable" }
          }

          # 2. wintun.dll: mandatory, straight from the official WHQL build.
          if (-not (Test-Path (Join-Path $vendor 'wintun.dll'))) {
            Invoke-WebRequest -Uri https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip -UseBasicParsing
            Expand-Archive -Path wintun.zip -DestinationPath wintun -Force
            Copy-Item wintun\wintun\bin\amd64\wintun.dll $vendor -Force
          }

          # 3. Last resort: build tunnel.dll from source (Wintun backend).
          if (-not $paired) {
          git clone --depth 1 https://git.zx2c4.com/wireguard-windows wg-windows
          Push-Location wg-windows\embeddable-dll-service
          $env:CGO_ENABLED = "1"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $destDll = Join-Path (Resolve-Path "..\..\$vendor") 'tunnel.dll'
          go build -buildmode=c-shared -ldflags="-w -s" -trimpath -o $destDll .
          Pop-Location
          }

          foreach ($dll in @('tunnel.dll', 'wintun.dll')) {
            if (-not (Test-Path (Join-Path $vendor $dll))) { throw "$dll is missing from $vendor" }
          }
          Get-ChildItem $vendor | Format-Table Name, Length
        shell: pwsh

      - name: Generate Flutter Windows scaffolding
        run: flutter create . --platforms windows --project-name glukvpn
        working-directory: flutter-client
        shell: pwsh

      - name: Generate Icons
        run: |
          pwsh -ExecutionPolicy Bypass -File desktop\packaging\make-icons.ps1
          Copy-Item flutter-client\assets\app.ico flutter-client\windows\runner\resources\app_icon.ico -Force
        shell: pwsh

      - name: Build Desktop App
        run: pwsh -ExecutionPolicy Bypass -File desktop\packaging\build-all.ps1 -Channel prod -Installer
        shell: pwsh
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlukVPN-Windows-Setup
          path: dist/*.exe

      - name: Publish Windows Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v1.0.0-build${{ github.run_number }}
          name: GlukVPN Windows v1.0.0 - Build ${{ github.run_number }}
          prerelease: true
          files: dist/GlukVPN-Setup-*.exe
          body: |
            GlukVPN Windows Desktop Client - v1.0.0
            
            * Installer: `GlukVPN-Setup-1.0.0.exe`
            * Commit: ${{ github.sha }}
            * Channel: Production
