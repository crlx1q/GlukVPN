name: Build Desktop Client

on:
  push:
    branches:
      - desktop/beta
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.x'

      - name: Configure Flutter for Windows Desktop
        run: flutter config --enable-windows-desktop
        shell: pwsh

      - name: Install Dependencies
        run: choco install innosetup -y
        shell: pwsh

      - name: Download WireGuard dependencies
        run: |
          Invoke-WebRequest -Uri https://download.wireguard.com/wireguard-nt/wireguard-nt-1.1.zip -OutFile wg-nt.zip
          Expand-Archive -Path wg-nt.zip -DestinationPath wg-nt
          New-Item -ItemType Directory -Force -Path native\glukvpn-tunnel-service\vendor\amd64 | Out-Null
          Copy-Item wg-nt\wireguard-nt\bin\amd64\wireguard.dll native\glukvpn-tunnel-service\vendor\amd64\
        shell: pwsh

      - name: Generate Icons
        run: pwsh -ExecutionPolicy Bypass -File desktop\packaging\make-icons.ps1
        shell: pwsh

      - name: Build Desktop App
        run: pwsh -ExecutionPolicy Bypass -File desktop\packaging\build-all.ps1 -Channel prod -Installer
        shell: pwsh
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlukVPN-Windows-Setup
          path: dist\*.exe
