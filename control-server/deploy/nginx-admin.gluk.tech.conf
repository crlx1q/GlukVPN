# GlukVPN admin panel on its own hostname - aaPanel nginx fragment.
#
# Use this file TWICE, changing one number:
#   admin.gluk.tech       -> proxy to 127.0.0.1:8081   (prod)
#   beta-admin.gluk.tech  -> proxy to 127.0.0.1:8082   (beta)
#
# WHERE THIS GOES
#   aaPanel -> Website -> Add site -> admin.gluk.tech, issue Let's Encrypt,
#   then Config file, and paste both location blocks below INSIDE the existing
#   `server { ... }` block, above aaPanel's static-file rules.
#
# WHY TWO LOCATIONS
#   The panel is a static bundle served by the API process under /admin/, and
#   it calls /api/... on the same origin. On this hostname we therefore map:
#     /api/  -> the API as-is
#     /      -> the /admin/ bundle
#   so the panel lives at the domain root without a second copy of the files
#   and without any CORS exception.

    # --- GlukVPN admin panel (begin) ---------------------------------------

    # API calls made by the panel. Must come first: nginx prefers the longer
    # prefix, and this one must not be rewritten into /admin/.
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering off;
        client_max_body_size 256k;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # The panel itself. The trailing slash on proxy_pass replaces the matched
    # "/" with "/admin/", so https://admin.gluk.tech/ serves the bundle.
    location / {
        proxy_pass http://127.0.0.1:8081/admin/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
    # --- GlukVPN admin panel (end) -----------------------------------------

# FOR beta-admin.gluk.tech
#   Replace both 8081 with 8082. Nothing else changes. When beta is switched
#   off the hostname answers 502, which is the correct "beta is off" signal.
#
# ACCESS CONTROL
#   The panel requires an admin login through the same API and the same short
#   lived JWT as before; the hostname only changes where the files are served
#   from. Do not add nginx basic auth on top - a second, weaker password is a
#   liability, not a second layer.
#
#   api.gluk.tech/admin keeps working as well. If you prefer a single entry
#   point, you may block /admin/ on api.gluk.tech later, but leave it reachable
#   until admin.gluk.tech is verified.
#
# HEALTH CHECK
#   curl -fsS -o /dev/null -w '%{http_code}\n' https://admin.gluk.tech/
#     -> 200, and the page must render the login form.
#   curl -fsS https://admin.gluk.tech/api/version
#     -> {"channel":"prod",...}
