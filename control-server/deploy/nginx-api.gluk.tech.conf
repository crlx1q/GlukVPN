# GlukVPN control API - reverse proxy fragment for the aaPanel nginx vhost.
#
# WHERE THIS GOES
#   aaPanel -> Website -> api.gluk.tech -> Config file
#   Paste the location block below INSIDE the existing `server { ... }` block
#   that aaPanel generated for api.gluk.tech, directly ABOVE aaPanel's own
#   static-file location rules (the ones matching *.js, *.css, *.png, ...).
#
# WHAT YOU MUST NOT TOUCH
#   Keep every line aaPanel generated, in particular:
#     - listen 443 ssl; / listen 80;
#     - ssl_certificate / ssl_certificate_key
#     - include /www/server/panel/vhost/rewrite/api.gluk.tech.conf;
#     - the location for /.well-known/acme-challenge  (SSL renewal)
#     - access_log / error_log lines
#   Deleting any of them breaks certificate renewal or the panel's own
#   management of this site. Never replace the whole file with this fragment.
#
# WHY A PROXY AND NOT A DOCUMENT ROOT
#   The API is a Node process bound to 127.0.0.1:8081. It is never exposed
#   directly: TLS termination, HTTP/2 and certificate renewal stay with the
#   nginx that aaPanel already operates, and no extra public port is opened.

    # --- GlukVPN control API (begin) ---------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # The API only returns small JSON documents and a tiny admin bundle.
        proxy_buffering off;
        client_max_body_size 256k;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
    # --- GlukVPN control API (end) -----------------------------------------

# NOTES
#
# 1. Rate limiting and login throttling key off the client IP. Fastify only
#    trusts X-Forwarded-For from the addresses listed in TRUST_PROXY, which
#    defaults to 127.0.0.1 and therefore matches this proxy. If you ever put
#    another hop in front (CDN, second nginx), add its address to TRUST_PROXY
#    or every request will look like it came from the proxy.
#
# 2. Security headers (HSTS, CSP, X-Frame-Options, ...) are set by
#    @fastify/helmet inside the app. Do not add a second copy in nginx: the
#    duplicated headers would be harder to reason about, not safer.
#
# 3. The admin panel is served by the same process under /admin. It is a
#    static bundle that calls the same authenticated API with an admin login,
#    so it needs no separate vhost or basic auth.
#
# 4. Health check, from the server itself:
#      curl -fsS http://127.0.0.1:8081/api/health
#    and through nginx:
#      curl -fsS https://api.gluk.tech/api/health
#    Both must return {"ok":true,...,"database":"up",...}.
