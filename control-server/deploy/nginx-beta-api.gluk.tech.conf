# GlukVPN control API, BETA channel - reverse proxy fragment for aaPanel nginx.
#
# WHERE THIS GOES
#   aaPanel -> Website -> Add site -> beta-api.gluk.tech (no PHP, no database)
#   then: beta-api.gluk.tech -> Config file, and paste the location block below
#   INSIDE the existing `server { ... }` block, above aaPanel's static rules.
#   Issue a Let's Encrypt certificate for this host from the panel first.
#
# WHAT YOU MUST NOT TOUCH
#   Every line aaPanel generated stays, in particular listen/ssl_certificate/
#   the rewrite include and the /.well-known/acme-challenge location. Removing
#   them breaks certificate renewal for this site.
#
# DIFFERENCE FROM PROD
#   The only difference is the upstream port: 8082 instead of 8081. Beta has
#   its own database, its own env file and its own JWT secret, so a token
#   minted here is rejected by prod and vice versa.
#
# NO NEW PUBLIC PORT IS OPENED. 8082 listens on loopback only; the internet
# reaches it through the same 443 that already serves the other sites.

    # --- GlukVPN control API, beta (begin) ---------------------------------
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering off;
        client_max_body_size 256k;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
    # --- GlukVPN control API, beta (end) -----------------------------------

# BETA OFF BEHAVIOUR
#
#   When vpn-control-beta.service is stopped, nothing is listening on 8082 and
#   this vhost answers 502. That is the intended "beta is off" state: the app
#   shows the beta channel as unavailable and keeps using prod. Do not add a
#   fallback to 8081 here - silently serving prod data under a beta hostname
#   is exactly the confusion these two channels exist to prevent.
#
# HEALTH CHECK
#   curl -fsS http://127.0.0.1:8082/api/health      # from the server
#   curl -fsS https://beta-api.gluk.tech/api/version # through nginx
#   The second one must report "channel":"beta".
