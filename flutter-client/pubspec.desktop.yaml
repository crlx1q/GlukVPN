# GlukVPN — Windows desktop pubspec.
#
# Why a separate file:
#   window_manager / tray_manager / launch_at_startup pull in desktop-only
#   plugins. Adding them to the main pubspec.yaml would change the Android
#   dependency graph, and requirement 1 says the Android build must not be
#   disturbed. desktop/packaging/build-all.ps1 swaps this file over
#   pubspec.yaml for the duration of the Windows build and restores the
#   original afterwards (try/finally, backup at pubspec.android.bak).
#
# Everything below is the mobile pubspec plus the desktop-only block, so the
# shared lib/ code compiles unchanged on both platforms.

name: glukvpn
description: GlukVPN client
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- shared with Android -------------------------------------------------
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  dart_ping: ^9.0.1
  google_fonts: ^6.2.1
  battery_plus: ^6.0.2

  # wireguard_flutter is Android-only. It stays in the dependency list so the
  # shared services/vpn_service.dart keeps compiling, but it is never used on
  # Windows — the desktop path goes through WindowsTunnelClient instead.
  wireguard_flutter: ^0.1.3

  # ---- desktop only --------------------------------------------------------
  window_manager: ^0.4.2 # frameless window, hide-to-tray, geometry
  tray_manager: ^0.2.3 # tray icon + context menu
  launch_at_startup: ^0.3.0 # Run-key helper (we also write it ourselves)
  package_info_plus: ^8.0.2 # version string in Settings
  path_provider: ^2.1.4 # %APPDATA% resolution fallback
  url_launcher: ^6.3.0 # "Manage subscription" → vpn.gluk.tech
  ffi: ^2.1.3 # named-pipe client
  win32: ^5.5.4 # Win32 API bindings (pipes, registry, DPAPI)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/tray/
