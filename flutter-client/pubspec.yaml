name: glukvpn
description: "GlukVPN Android client: real WireGuard tunnel through the system Android VPN API."
publish_to: "none"

# Bumped for the redesign. The PROD/BETA control-plane versions are reported
# separately by GET /api/version and shown in Settings.
version: 1.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # REST calls to the control plane (PROD or BETA channel).
  http: ^1.2.2

  # ROUND 17: Material's own translations.
  #
  # This is the broken sign-in form. app.dart sets locale "ru" and lists it in
  # supportedLocales, but the only material delegate in the tree was
  # DefaultMaterialLocalizations, which supports English and nothing else. With
  # the resolved locale unsupported there is no MaterialLocalizations at all,
  # and TextField, Tooltip and IconButton each throw while building. A release
  # build paints a thrown widget as a plain grey rectangle with no text - which
  # is exactly the "big grey rectangle instead of the form" on the phone.
  # It never showed on Windows because the desktop entry point never sets a
  # locale, so that MaterialApp resolves to English and stays supported.
  flutter_localizations:
    sdk: flutter

  # Simple ChangeNotifier state management (no code generation).
  provider: ^6.1.2

  # Android Keystore-backed storage for the device private key and refresh token.
  flutter_secure_storage: ^9.2.2

  # Pure-Dart X25519: the WireGuard key pair is generated ON the device.
  cryptography: ^2.7.0

  # Real WireGuard tunnel through Android VpnService (GoBackend).
  wireguard_flutter: ^0.1.3

  # ICMP ping to the tunnel gateway, for the live latency readout.
  dart_ping: ^9.0.1

  # Poppins - the type family used by the design mock-ups. Fetched once on first
  # launch and cached on the device; falls back to the platform font offline.
  google_fonts: ^6.2.1

  # Battery-saver / battery-level signals, so the animated map can freeze itself
  # instead of burning frames in power-saving mode.
  battery_plus: ^6.0.2

  # Renders the official Google and Telegram marks from assets/brands/*.svg.
  # Pure Dart, so it adds no native plugin to the Android or Windows build -
  # which is why it is safe to share between the two pubspecs.
  flutter_svg: ^2.0.10+1

  # ROUND 11: opens the Telegram bot for sign-in and for the last step of
  # sign-up, and the download page from the update banner. Until now those
  # places copied a URL to the clipboard and asked the user to paste it into
  # a browser, which is not a flow, it is an apology.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Drop logo.png in here (flutter-client/assets/logo.png). The whole folder
    # is declared rather than the single file, so the build still succeeds while
    # the artwork is missing - GlukLogo falls back to a plain violet tile.
    # The world map is not an asset: it is a 2 KB bitmask decoded at runtime
    # (lib/data/world_map_data.dart).
    - assets/
    # Subdirectories are not covered by the line above, so brand artwork has to
    # be declared explicitly.
    - assets/brands/
