name: glukvpn
description: "GlukVPN Android client (prototype): real WireGuard tunnel via the system Android VPN API."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # REST calls to the control plane.
  http: ^1.2.2

  # Simple ChangeNotifier state management (no code generation).
  provider: ^6.1.2

  # Android Keystore-backed storage for the device private key and refresh token.
  flutter_secure_storage: ^9.2.2

  # Pure-Dart X25519: the WireGuard key pair is generated ON the device.
  cryptography: ^2.7.0

  # Real WireGuard tunnel through Android VpnService (GoBackend).
  wireguard_flutter: ^0.1.3

  # ICMP ping to the tunnel gateway, for the live latency readout.
  dart_ping: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
