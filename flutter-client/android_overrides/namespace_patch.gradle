// ---------------------------------------------------------------------------
// AGP 8 compatibility shim.
//
// CI appends this file to the generated android/build.gradle.
//
// Why: wireguard_flutter 0.1.3 was published before Android Gradle Plugin 8
// made `namespace` mandatory for every module. Without this the build fails
// with:
//
//   Namespace not specified. Specify a namespace in the module's build file.
//
// Fix: use pluginManager.withPlugin() instead of afterEvaluate{} — AGP 8
// evaluates subprojects eagerly, so afterEvaluate throws
// "Cannot run afterEvaluate when the project is already evaluated".
// pluginManager.withPlugin() fires at plugin-application time, before
// configuration, which is safe in all Gradle/AGP versions.
// ---------------------------------------------------------------------------
subprojects {
    pluginManager.withPlugin('com.android.library') {
        android {
            if (!namespace) {
                namespace = project.group.toString()
            }
        }
    }
    pluginManager.withPlugin('com.android.application') {
        android {
            if (!namespace) {
                namespace = project.group.toString()
            }
        }
    }
}
