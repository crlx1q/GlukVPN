// ---------------------------------------------------------------------------
// AGP 8 compatibility shim.
//
// CI appends this file to the generated android/build.gradle.
//
// Why: wireguard_flutter 0.1.3 was published in December 2023, before Android
// Gradle Plugin 8 made `namespace` mandatory for every module. Without this the
// build fails with:
//
//   Namespace not specified. Specify a namespace in the module's build file.
//
// Instead of forking the plugin we fill the namespace in from the module's
// Gradle group id (which is exactly what AGP used to derive from the manifest
// `package` attribute). This changes nothing about app behaviour or security.
// ---------------------------------------------------------------------------
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.library')
                || project.plugins.hasPlugin('com.android.application')) {
            project.android {
                if (namespace == null) {
                    namespace project.group.toString()
                }
            }
        }
    }
}
